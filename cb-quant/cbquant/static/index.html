<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CB Quant 워크플로</title>
<style>
  :root {
    --bg: #f4f5f2; --surface: #ffffff; --line: #d9dcd3; --text: #1c211d; --muted: #6a7268;
    --accent: #0b6e69; --accent-soft: #d9efec; --ok: #2f7d3b; --ok-soft: #e1f1e2;
    --wait: #a8650a; --wait-soft: #fbecd2; --bad: #b3352b; --bad-soft: #f8dfdc; --edge: #b4b9ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131714; --surface: #1c221e; --line: #323a34; --text: #e6eae4; --muted: #96a096;
      --accent: #4fc4bc; --accent-soft: #173b39; --ok: #6cc47a; --ok-soft: #1c3a22;
      --wait: #e5a84a; --wait-soft: #40300f; --bad: #ef8377; --bad-soft: #44201c; --edge: #4a544b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--wait-soft); color: var(--wait); }
  .controls { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  label { font-size: 13px; color: var(--muted); }
  select, input[type=text] {
    font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px;
  }
  button {
    font: inherit; font-weight: 600; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  }
  button.secondary { background: transparent; color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #run-state { font-size: 13px; color: var(--muted); min-width: 7em; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
  #graph { width: 100%; height: auto; display: block; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .edge.taken { stroke: var(--accent); stroke-width: 2.25; }
  .route { font-size: 11.5px; fill: var(--muted); }
  .route.taken { fill: var(--accent); font-weight: 600; }
  .route-bg { fill: var(--surface); }
  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .node .title { font-size: 14px; font-weight: 600; fill: var(--text); }
  .node .sub { font-size: 11.5px; fill: var(--muted); }
  .node.selected rect { stroke-width: 2.5; }
  .node.running rect { stroke: var(--accent); fill: var(--accent-soft); }
  .node.completed rect { stroke: var(--ok); fill: var(--ok-soft); }
  .node.waiting rect { stroke: var(--wait); fill: var(--wait-soft); }
  .node.failed rect { stroke: var(--bad); fill: var(--bad-soft); }
  .node.running rect, .node.waiting rect { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-width: 4; } }
  @media (prefers-reduced-motion: reduce) { .node rect { animation: none !important; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; border: 1.5px solid; vertical-align: -1px; }

  #approval { border-color: var(--wait); }
  #approval[hidden] { display: none; }
  #approval .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #approval input { flex: 1 1 180px; min-width: 0; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); }
  th:first-child, td:first-child { text-align: left; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0 0 8px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #detail > div + div { margin-top: 16px; }
  pre { margin: 0; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #log li { padding: 2px 0; display: flex; gap: 10px; }
  #log time { color: var(--muted); flex: none; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>CB Quant 워크플로</h1>
  <span class="badge">표본(가상) 데이터 · 실제 주문 없음</span>
  <div class="controls">
    <label for="speed">단계 표시 시간</label>
    <select id="speed">
      <option value="0">지연 없음</option>
      <option value="0.6" selected>0.6초</option>
      <option value="1.5">1.5초</option>
    </select>
    <span id="run-state" role="status">대기 중</span>
    <button id="run">실행</button>
  </div>
</header>

<main>
  <div class="stack">
    <section>
      <h2>그래프</h2>
      <svg id="graph" role="img" aria-label="워크플로 그래프"></svg>
      <div class="legend">
        <span><i style="border-color:var(--line)"></i>대기</span>
        <span><i style="border-color:var(--accent);background:var(--accent-soft)"></i>실행 중</span>
        <span><i style="border-color:var(--ok);background:var(--ok-soft)"></i>완료</span>
        <span><i style="border-color:var(--wait);background:var(--wait-soft)"></i>사람 응답 대기</span>
        <span><i style="border-color:var(--bad);background:var(--bad-soft)"></i>실패</span>
      </div>
    </section>
  </div>
  <div class="stack">
    <section id="approval" hidden>
      <h2>승인 요청</h2>
      <p id="approval-message" style="margin:0 0 8px"></p>
      <div id="approval-tickets" class="table-wrap"></div>
      <div class="actions">
        <input id="note" type="text" placeholder="메모 (선택)" aria-label="메모">
        <button id="approve">승인</button>
        <button id="reject" class="secondary">반려</button>
      </div>
    </section>
    <section>
      <h2 id="detail-title">노드 결과</h2>
      <div id="detail"><p class="empty">실행을 누르면 각 단계의 결과가 여기에 표시됩니다. 노드를 클릭하면 해당 단계 결과를 볼 수 있습니다.</p></div>
    </section>
    <section>
      <h2>실행 기록</h2>
      <ol id="log"><li class="empty">아직 기록이 없습니다.</li></ol>
    </section>
  </div>
</main>

<script>
const SVG = "http://www.w3.org/2000/svg";
const NODE_W = 190, NODE_H = 50, LAYER_GAP = 84, COLUMN_GAP = 230, LEFT_PAD = 120, TOP_PAD = 14;
const STATUS_TEXT = { running: "실행 중", completed: "완료", waiting: "사람 응답 대기", failed: "실패" };
const ROUTE_TEXT = { pass: "통과", breach: "한도 초과", no_trades: "대상 없음" };
const FIELD_TEXT = {
  bond_id: "종목", issuer: "발행사", action: "구분", market_price: "시장가", model_price: "모델가", parity: "패리티",
  bond_floor: "채권가치", delta: "델타(주)", delta_pct: "델타", vega: "베가", credit_spread: "신용스프레드",
  cheapness: "저평가", face_amount: "액면", market_value: "평가금액", hedge_shares: "헤지 주식수",
  rule: "규칙", subject: "대상", value: "값", limit: "한도", bonds: "종목 수", source: "데이터", tickets: "티켓",
  total_value: "총 평가금액", breaches: "한도 위반", dropped: "제외 종목", approved: "승인 여부", note: "메모",
  path: "저장 위치", signals: "신호", valuations: "가격평가", markdown: "리포트",
};
const PERCENT_FIELDS = new Set(["cheapness", "credit_spread", "delta_pct"]);
const RULE_TEXT = { credit_spread: "신용스프레드 한도", issuer_limit: "발행사 한도", total_limit: "총액 한도" };

const el = (id) => document.getElementById(id);
let spec = null, nodes = {}, source = null, runId = null, selected = null, pinned = false;
let view = { status: {}, runs: {}, outputs: {}, taken: new Set() };

function svg(tag, attrs, parent) {
  const node = document.createElementNS(SVG, tag);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  if (parent) parent.appendChild(node);
  return node;
}

function box(n) {
  const x = LEFT_PAD + n.column * COLUMN_GAP, y = TOP_PAD + n.layer * LAYER_GAP;
  return { x, y, cx: x + NODE_W / 2, cy: y + NODE_H / 2, right: x + NODE_W, bottom: y + NODE_H };
}

function edgePath(from, to) {
  const a = box(from), b = box(to), span = to.layer - from.layer;
  if (span === 1 && from.column === to.column)            // straight down
    return { d: `M${a.cx},${a.bottom} L${a.cx},${b.y - 7}`, lx: a.cx - 9, ly: (a.bottom + b.y) / 2 - 2, beside: true };
  if (span === 1) {                                        // down and across
    const sx = a.cx + 45 * Math.sign(b.cx - a.cx), ex = b.cx - 30 * Math.sign(b.cx - a.cx);
    return { d: `M${sx},${a.bottom} C${sx},${a.bottom + 34} ${ex},${b.y - 44} ${ex},${b.y - 7}`, lx: (sx + ex) / 2, ly: (a.bottom + b.y) / 2 };
  }
  if (span <= 0) {                                         // loop back up
    const sx = a.cx + 30;
    return { d: `M${sx},${a.y} C${sx},${b.cy} ${sx},${b.cy} ${b.right + 7},${b.cy}`, lx: sx, ly: (a.y + b.cy) / 2 + 6 };
  }
  const out = a.x - 90;                                    // skip over layers, around the left
  return { d: `M${a.x},${a.cy} C${out},${a.cy} ${out},${b.cy} ${b.x - 7},${b.cy}`, lx: a.x - 68, ly: (a.cy + b.cy) / 2 };
}

function drawGraph() {
  const graph = el("graph");
  graph.replaceChildren();
  const layers = Math.max(...spec.nodes.map((n) => n.layer)) + 1;
  const columns = Math.max(...spec.nodes.map((n) => n.column)) + 1;
  const width = LEFT_PAD + (columns - 1) * COLUMN_GAP + NODE_W + 20, height = TOP_PAD * 2 + (layers - 1) * LAYER_GAP + NODE_H;
  graph.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const defs = svg("defs", {}, graph);
  for (const [id, color] of [["arrow", "var(--edge)"], ["arrow-taken", "var(--accent)"]]) {
    const marker = svg("marker", { id, viewBox: "0 0 10 10", refX: 5, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    svg("path", { d: "M0,1 L9,5 L0,9 z", fill: color }, marker);
  }

  nodes = Object.fromEntries(spec.nodes.map((n) => [n.id, n]));
  for (const edge of spec.edges) {
    const shape = edgePath(nodes[edge.from], nodes[edge.to]);
    edge.line = svg("path", { class: "edge", d: shape.d, "marker-end": "url(#arrow)" }, graph);
    if (edge.route) {
      const text = ROUTE_TEXT[edge.route] || edge.route;
      const w = text.length * 11.5 + 10;
      if (!shape.beside) svg("rect", { class: "route-bg", x: shape.lx - w / 2, y: shape.ly - 9, width: w, height: 18, rx: 4 }, graph);
      edge.label = svg("text", { class: "route", x: shape.lx, y: shape.ly + 4, "text-anchor": shape.beside ? "end" : "middle" }, graph);
      edge.label.textContent = text;
    }
  }
  for (const n of spec.nodes) {
    const b = box(n);
    n.group = svg("g", { class: "node", tabindex: 0, role: "button" }, graph);
    svg("rect", { x: b.x, y: b.y, width: NODE_W, height: NODE_H, rx: n.kind === "start" ? 25 : 8 }, n.group);
    n.title = svg("text", { class: "title", x: b.cx, y: b.y + (n.kind === "start" ? 30 : 21), "text-anchor": "middle" }, n.group);
    n.title.textContent = n.label;
    n.sub = svg("text", { class: "sub", x: b.cx, y: b.y + 38, "text-anchor": "middle" }, n.group);
    const pick = () => { pinned = true; select(n.id); };
    n.group.addEventListener("click", pick);
    n.group.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pick(); } });
  }
  paint();
}

function paint() {
  for (const n of spec.nodes) {
    const status = n.kind === "start" ? (runId ? "completed" : "") : view.status[n.id] || "";
    n.group.setAttribute("class", `node ${status} ${selected === n.id ? "selected" : ""}`);
    const times = view.runs[n.id] > 1 ? ` · ${view.runs[n.id]}회차` : "";
    n.sub.textContent = n.kind === "start" ? "" : (STATUS_TEXT[status] || (n.kind === "human" ? "사람이 결정" : "코드")) + times;
    n.group.setAttribute("aria-label", `${n.label} ${n.sub.textContent}`);
  }
  for (const edge of spec.edges) {
    const taken = view.taken.has(`${edge.from}>${edge.to}`);
    edge.line.setAttribute("class", taken ? "edge taken" : "edge");
    edge.line.setAttribute("marker-end", taken ? "url(#arrow-taken)" : "url(#arrow)");
    if (edge.label) edge.label.setAttribute("class", taken ? "route taken" : "route");
  }
}

function format(key, value) {
  if (value === null || value === undefined || value === "") return "–";
  if (typeof value === "boolean") return value ? "예" : "아니오";
  if (key === "rule") return RULE_TEXT[value] || value;
  if (key === "subject" && value === "book") return "전체 티켓";
  if (typeof value !== "number") return String(value);
  if (PERCENT_FIELDS.has(key)) return (value * 100).toFixed(1) + "%";
  if (Number.isInteger(value) || Math.abs(value) >= 10000) return Math.round(value).toLocaleString("ko-KR");
  return value.toFixed(2);
}

function table(rows) {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const keys = Object.keys(rows[0]);
  const t = wrap.appendChild(document.createElement("table"));
  const head = t.createTHead().insertRow();
  for (const key of keys) head.appendChild(document.createElement("th")).textContent = FIELD_TEXT[key] || key;
  const body = t.createTBody();
  for (const row of rows) {
    const tr = body.insertRow();
    // A breach row mixes money and percentages; format its numbers by the rule.
    for (const key of keys) tr.insertCell().textContent = format(row.rule === "credit_spread" && (key === "value" || key === "limit") ? "credit_spread" : key, row[key]);
  }
  return wrap;
}

function renderOutput(output, into) {
  into.replaceChildren();
  if (output === null || typeof output !== "object") { into.textContent = String(output); return; }
  const facts = document.createElement("dl");
  const blocks = [];
  for (const [key, value] of Object.entries(output)) {
    const name = FIELD_TEXT[key] || key;
    if (Array.isArray(value) && value.length && typeof value[0] === "object") blocks.push([name, table(value)]);
    else if (key === "markdown") { const pre = document.createElement("pre"); pre.textContent = value; blocks.push([name, pre]); }
    else {
      facts.appendChild(document.createElement("dt")).textContent = name;
      facts.appendChild(document.createElement("dd")).textContent = Array.isArray(value) ? (value.length ? value.join(", ") : "없음") : format(key, value);
    }
  }
  if (facts.children.length) into.appendChild(facts);
  for (const [name, block] of blocks) {
    into.appendChild(document.createElement("h2")).textContent = name;
    into.appendChild(block);
  }
}

function select(id) {
  selected = id;
  const n = nodes[id];
  el("detail-title").textContent = `노드 결과 · ${n.label}`;
  const results = view.outputs[id];
  if (results === undefined) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = view.status[id] === "waiting" ? "사람의 승인을 기다리는 중입니다." : view.status[id] === "running" ? "실행 중입니다." : "아직 결과가 없습니다.";
    el("detail").replaceChildren(p);
  } else {
    // A node inside a loop runs more than once; show every pass, newest last.
    el("detail").replaceChildren(...results.map((result, index) => {
      const block = document.createElement("div");
      renderOutput(result.output, block);
      if (results.length > 1) {
        const heading = document.createElement("h2");
        heading.textContent = `${index + 1}회차` + (result.route ? ` · ${ROUTE_TEXT[result.route] || result.route}` : "");
        block.prepend(heading);
      }
      return block;
    }));
  }
  paint();
}

function log(text, isError) {
  const list = el("log");
  if (list.firstElementChild && list.firstElementChild.classList.contains("empty")) list.replaceChildren();
  const item = list.appendChild(document.createElement("li"));
  item.appendChild(document.createElement("time")).textContent = new Date().toLocaleTimeString("en-GB");
  const body = item.appendChild(document.createElement("span"));
  body.textContent = text;
  if (isError) body.className = "error";
  list.scrollTop = list.scrollHeight;
}

function apply(update) {
  if (update.type === "node") {
    view.status[update.node] = update.status;
    if (update.status === "running") view.runs[update.node] = (view.runs[update.node] || 0) + 1;
    log(`${nodes[update.node].label}: ${STATUS_TEXT[update.status]}`, update.status === "failed");
    if (!pinned && update.status !== "completed") select(update.node);
  } else if (update.type === "output") {
    (view.outputs[update.node] ||= []).push({ output: update.output, route: update.route });
    for (const edge of spec.edges)
      if (edge.from === update.node && (edge.route === null || edge.route === update.route)) view.taken.add(`${edge.from}>${edge.to}`);
    if (update.route) log(`${nodes[update.node].label} → ${ROUTE_TEXT[update.route] || update.route}`);
    if (selected === update.node) select(update.node);
  } else if (update.type === "approval") {
    el("approval-message").textContent = update.message;
    el("approval-tickets").replaceChildren(table(update.tickets.map((t) => ({
      bond_id: t.bond_id, face_amount: t.face_amount, market_value: t.market_value, cheapness: t.cheapness, hedge_shares: t.hedge_shares,
    }))));
  } else if (update.type === "done") {
    const waiting = update.status === "waiting";
    el("approval").hidden = !waiting;
    el("approve").disabled = el("reject").disabled = !waiting;
    el("run").disabled = waiting;
    el("run-state").textContent = { waiting: "승인 대기", completed: "완료", failed: "실패" }[update.status];
    if (update.status === "failed") log(update.error, true);
    if (!waiting) { source.close(); source = null; }
  }
  paint();
}

function resetView() {
  view = { status: {}, runs: {}, outputs: {}, taken: new Set() };
  view.taken.add(`__START__>${spec.edges.find((e) => e.from === "__START__").to}`);
  el("log").replaceChildren();
  el("approval").hidden = true;
}

async function startRun() {
  el("run").disabled = true;
  el("run-state").textContent = "실행 중";
  pinned = false;
  if (source) source.close();
  const response = await fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ step_delay: Number(el("speed").value) }),
  });
  runId = (await response.json()).run_id;
  source = new EventSource(`/api/runs/${runId}/events`);
  source.onopen = resetView;                       // the server replays the whole run on every (re)connect
  source.onmessage = (event) => apply(JSON.parse(event.data));
}

async function decide(approved) {
  el("approve").disabled = el("reject").disabled = true;
  el("run-state").textContent = "실행 중";
  const response = await fetch(`/api/runs/${runId}/approval`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approved, note: el("note").value }),
  });
  if (response.ok) { el("approval").hidden = true; el("note").value = ""; log(approved ? "승인함" : "반려함"); }
  else log("승인 요청을 처리하지 못했습니다.", true);
}

el("run").addEventListener("click", startRun);
el("approve").addEventListener("click", () => decide(true));
el("reject").addEventListener("click", () => decide(false));
fetch("/api/graph").then((response) => response.json()).then((data) => { spec = data; drawGraph(); });
</script>
</body>
</html>
